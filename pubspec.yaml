name: wine_with_me
description: A blind wine tasting voting app for parties

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.1

  # Unique IDs
  uuid: ^4.2.1

  # Local storage
  shared_preferences: ^2.2.2

  # Date formatting
  intl: ^0.18.1

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
